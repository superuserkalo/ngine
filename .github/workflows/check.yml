name: Check

on:
  push:
    branches: [main]
    paths-ignore: ['.claude/**']
  pull_request:
    paths-ignore: ['.claude/**']

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Linux build packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libclang-dev clang pkg-config libpipewire-0.3-dev
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: FFmpeg libraries
        uses: ./.github/actions/ffmpeg
      - name: Windows finds libclang and the FFmpeg DLLs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "LIBCLANG_PATH=C:\\Program Files\\LLVM\\bin" >> "$GITHUB_ENV"
          cygpath -w "$NGINE_FFMPEG_DIR/bin" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Agent docs stay small
        shell: bash
        run: |
          lines=$(wc -l < AGENTS.md)
          if [ "$lines" -gt 120 ]; then
            echo "AGENTS.md is $lines lines; the budget is 120. Prune it."
            exit 1
          fi
          extra=$(git ls-files docs | grep -v -E '^docs/(adr|agents)/' || true)
          if [ -n "$extra" ]; then
            echo "docs/ holds only docs/adr and docs/agents. Move these to an issue:"
            echo "$extra"
            exit 1
          fi
      - name: Tests leave the checkout clean
        shell: bash
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Advisories, bans and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command-arguments: advisories bans sources
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Direct dependencies are pinned to exact versions
        run: |
          loose=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | .name as $p | .dependencies[] | select(.source != null and (.req | startswith("=") | not) and (.source | test("^git\\+.*[?]rev=[0-9a-f]{40}$") | not)) | "\($p): \(.name) \(.req)"')
          if [ -n "$loose" ]; then
            echo "Pin these to an exact version (\"=1.2.3\") or a full git rev:"
            echo "$loose"
            exit 1
          fi
      - name: No dependency is GPL-only
        run: |
          copyleft=$(cargo metadata --format-version 1 --locked | jq -r '.packages[] | select(.license != null) | select([.license | splits(" +OR +|/")] | all(test("GPL"))) | "\(.name) \(.version): \(.license)"')
          if [ -n "$copyleft" ]; then
            echo "ngine is MIT. These dependencies offer only a GPL-type licence, so ask the owner first:"
            echo "$copyleft"
            exit 1
          fi
