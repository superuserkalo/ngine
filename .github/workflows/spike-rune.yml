name: Spike Rune

on:
  push:
    branches: [main]
    paths:
      - spikes/rune/**
      - .github/workflows/spike-rune.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spike-rune-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  spike:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: spikes/rune
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Linux build and display packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxkbcommon-x11-0 mesa-vulkan-drivers xvfb
          echo "VK_ICD_FILENAMES=/usr/share/vulkan/icd.d/lvp_icd.json" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - name: Build
        run: cargo build --release --locked
      - name: Binary size
        run: ls -l target/release/ | grep -E 'rune-spike(\.exe)?$'
      - name: Headless render
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: target/release/rune-spike --snap "snap-$RUNNER_OS.png"
      - name: Window, 1080p frames and overlay
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            SPIKE_SECONDS=5 xvfb-run -a target/release/rune-spike
          else
            SPIKE_SECONDS=5 target/release/rune-spike
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: snap-${{ matrix.os }}
          path: spikes/rune/snap-*.png
          if-no-files-found: warn
