[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/superuserkalo/ngine"
publish = false

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
