[package]
name = "ngine-capture"
description = "Screen and audio capture for macOS, Windows and Linux behind one API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = { version = "=11.1.2", default-features = false, features = ["macos_15_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=2.0.1"
wasapi = "=0.27.0"
windows = { version = "=0.62.2", features = ["Win32_Graphics_Direct3D11"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "=0.14.0", default-features = false, features = ["async-io", "screencast"] }
pipewire = { version = "=0.10.1", default-features = false }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "time"] }
x11rb = { version = "=0.14.0", default-features = false, features = ["shm", "xfixes", "randr", "composite"] }

[lints]
workspace = true
