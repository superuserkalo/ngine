[package]
name = "ngine-recorder"
description = "The engine of ngine without any UI: capture to encoder to file, and the instant replay buffer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"
links = "ngine_recorder"

[dependencies]
ngine-capture = { path = "../ngine-capture" }
ngine-media = { path = "../ngine-media" }
sysinfo = { version = "=0.40.3", default-features = false, features = ["system"] }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[lints]
workspace = true
