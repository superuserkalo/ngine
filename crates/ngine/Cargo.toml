[package]
name = "ngine"
description = "A lightweight screen recorder and clipper for Windows, macOS and Linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
ngine-capture = { path = "../ngine-capture" }
ngine-recorder = { path = "../ngine-recorder" }
rune = { git = "https://github.com/anomalyco/rune", rev = "80022c59736b9ef48c2b6954ba29bafbc78ae428", default-features = false, features = ["accessibility", "dbus", "embedded-fonts", "metal-backend", "svg"] }

trash = { version = "=5.3.0", default-features = false, features = ["coinit_apartmentthreaded", "freedesktop"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
cpal = "=0.18.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSImage", "NSMenu", "NSMenuItem", "NSResponder", "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "objc2-core-foundation"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }

[target.'cfg(target_os = "windows")'.dependencies]
interprocess = { version = "=2.4.8", default-features = false }
widestring = "=1.2.1"

[lints]
workspace = true
