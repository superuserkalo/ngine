unbind = ALT, PRINT
bindd = ALT, PRINT, Screenrecording, exec, ngine record toggle
bindd = SHIFT ALT, PRINT, Save the last 30 seconds, exec, ngine replay save --last 30s
bindd = SUPER ALT, PRINT, Instant replay on or off, exec, ngine replay toggle
bindd = CTRL ALT, PRINT, Recording marker, exec, ngine marker
